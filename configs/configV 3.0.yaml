# ==============================================================================
# 配置版本: configV 3.0 (Mihomo 模块化与 GitHub 远程分流终极版)
# 参考教程: 七尺宇《mihomo DNS 深度精讲：从敲下回车到数据包出站，彻底搞懂所有分流场景与防泄露》
# 核心升级:
#   1. [规则上云] 手动维护的 AI/Web3/交易所/测速/Telegram 规则全部剥离至 GitHub 仓库远程引用
#   2. [隐私安全] 个人自建 VPS IP 与私有服务域名保留在本地配置，敏感信息零泄露
#   3. [DNS防泄露探针] nameserver 采用海外安全 DoH + 代理出站(#🚀 默认代理) + 国内 ECS(&ecs=223.5.5.0/24)
#   4. [Type-65 优化] policy 与直连 DNS 全面附加 #disable-qtype-65=true，消灭浏览器握手白屏与停顿
#   5. [Fake-IP 过滤完善] 将 cn_domain 与核心系统服务纳入 fake-ip-filter，国内流量 100% 真实国内最优 CDN IP
#   6. [QUIC 精准阻断] 针对境外规则集精确 REJECT UDP 443，强迫回退 TCP BBR，避免海外 QUIC 劣化与卡顿
#   7. [探针闭环] cn_ip 去除 no-resolve，依托加密代理探针实现“冷门域名防泄漏”与“未知国内IP精准识别”的完美统一
# ==============================================================================

# 机场订阅公共模板（YAML 锚点，非 mihomo 配置项；统一过滤公告/到期/流量等非节点条目）
proxy-anchor:
  pp: &pp
    type: http
    interval: 86400
    proxy: 直连
    exclude-filter: '(?i)直接连接|群|邀请|返利|循环|官网|官址|客服|网站|网址|获取|订阅|流量|剩余|重置|套餐|到期|过期|机场|下次|版本|已用|联系|邮箱|工单|贩卖|倒卖|通知|防止|频道|无法|说明|使用|提示|教程|关注|更新|作者|加入|\bDIRECT\b|\bEXPIRE|\bTOTAL\b|\bTRAFFIC\b|\bEMAIL\b|\bPANEL\b|\bCHANNEL\b|\bAUTHOR\b'
    override: {udp: true}
    health-check: {enable: true, url: "https://www.gstatic.com/generate_204", interval: 1800, lazy: true, expected-status: 204}

