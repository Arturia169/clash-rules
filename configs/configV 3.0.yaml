    url: https://example.com/subscription-1.yaml
  订阅2:
    type: http
    interval: 86400
    proxy: 直连
    exclude-filter: (?i)直接连接|群|邀请|返利|循环|官网|官址|客服|网站|网址|获取|订阅|流量|剩余|重置|套餐|到期|过期|机场|下次|版本|已用|联系|邮箱|工单|贩卖|倒卖|通知|防止|频道|无法|说明|使用|提示|教程|关注|更新|作者|加入|\bDIRECT\b|\bEXPIRE|\bTOTAL\b|\bTRAFFIC\b|\bEMAIL\b|\bPANEL\b|\bCHANNEL\b|\bAUTHOR\b
    override:
      udp: true
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 1800
      lazy: true
      expected-status: 204
    url: https://example.com/subscription-2.yaml
  订阅3:
    type: http
    interval: 86400
    proxy: 直连
    exclude-filter: (?i)直接连接|群|邀请|返利|循环|官网|官址|客服|网站|网址|获取|订阅|流量|剩余|重置|套餐|到期|过期|机场|下次|版本|已用|联系|邮箱|工单|贩卖|倒卖|通知|防止|频道|无法|说明|使用|提示|教程|关注|更新|作者|加入|\bDIRECT\b|\bEXPIRE|\bTOTAL\b|\bTRAFFIC\b|\bEMAIL\b|\bPANEL\b|\bCHANNEL\b|\bAUTHOR\b
