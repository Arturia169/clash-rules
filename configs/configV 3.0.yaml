  - RULE-SET,youtube_domain,📹 YouTube
  - RULE-SET,custom_speedtest,🚀 节点测速
  - RULE-SET,speedtest_domain,🚀 节点测速
  # 游戏内容下载优先于 Google / Microsoft 等平台大类；公共下载集合包含境内外 CDN。
