# 自建节点占位参数：文档保留 IP、示例 UUID/密钥和密码均需自行替换。
proxies:
- name: 直连
  type: direct
  udp: true
- name: 🇺🇸 自建美国-1-Reality
  type: vless
  server: 192.0.2.10
  port: 443
  uuid: 00000000-0000-4000-8000-000000000001
  network: tcp
  tls: true
  flow: xtls-rprx-vision
  servername: www.example.com
  client-fingerprint: chrome
  reality-opts:
    public-key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    short-id: '0000000000000000'
  udp: true
- name: 🇺🇸 自建美国-1-HY2
  type: hysteria2
  server: 192.0.2.10
  ports: '443'
  password: REPLACE_WITH_YOUR_PASSWORD
  alpn:
  - h3
  hop-interval: 30
  skip-cert-verify: true
  udp: true
- name: 🇺🇸 自建美国-2-Reality
  type: vless
  server: 192.0.2.11
  port: 443
  uuid: 00000000-0000-4000-8000-000000000001
  network: tcp
  tls: true
  udp: true
  flow: xtls-rprx-vision
  servername: www.example.com
  client-fingerprint: chrome
  reality-opts:
    public-key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
- name: 🇩🇪 自建德国-HY2
  type: hysteria2
  server: 192.0.2.12
  ports: '443'
  password: REPLACE_WITH_YOUR_PASSWORD
  sni: www.example.com
  alpn:
  - h3
  hop-interval: 30
  skip-cert-verify: true
  udp: true
- name: 🇺🇸 自建美国-2-HY2
  type: hysteria2
  server: 192.0.2.11
  ports: '443'
  password: REPLACE_WITH_YOUR_PASSWORD
  alpn:
  - h3
  hop-interval: 30
  skip-cert-verify: true
  udp: true

mixed-port: 7890
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: error
keep-alive-idle: 600
keep-alive-interval: 15
profile:
  store-selected: true
  store-fake-ip: true
  tracing: false

# 嗅探模块（配合 Fake-IP 模式补充解析纯 IP 流量，override-destination 设为 false 避免覆盖原目的地址）
sniffer:
  enable: true
  override-destination: false
  force-dns-mapping: false
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# 入站（TUN 模块，按需开启）
tun:
  enable: false
  stack: mixed
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: false
  auto-detect-interface: true
  strict-route: true
  endpoint-independent-nat: true

# ==============================================================================
# DNS 模块（V2.2 核心架构）
# ==============================================================================
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/16
  fake-ip-ttl: 300
  cache-algorithm: arc
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  proxy-server-nameserver:
  - https://223.5.5.5/dns-query
  - https://1.12.12.12/dns-query
  direct-nameserver:
  - https://dns.alidns.com/dns-query#disable-qtype-65=true
  - https://doh.pub/dns-query#disable-qtype-65=true
  nameserver:
  - https://8.8.8.8/dns-query#🚀 默认代理&ecs=223.5.5.0/24
  - https://1.1.1.1/dns-query#🚀 默认代理
  nameserver-policy:
    rule-set:cn_domain,private_domain,steam_cn,steam_cdn_domain:
    - https://dns.alidns.com/dns-query#disable-qtype-65=true
    - https://doh.pub/dns-query#disable-qtype-65=true
    rule-set:fakeipfilter_domain:
    - https://dns.alidns.com/dns-query#disable-qtype-65=true
    - https://doh.pub/dns-query#disable-qtype-65=true
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
  - rule-set:fakeipfilter_domain
  - rule-set:private_domain
  - rule-set:steam_cn
  - rule-set:steam_cdn_domain
  - +.cloudflare.com
  - +.jsdelivr.net
  - +.workbuddy.ai
  - +.deepseek.com
  - +.deepseek.ai

