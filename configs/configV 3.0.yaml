# 导入前填写订阅 URL 和自建节点参数；示例节点不可直接用于联网。

rules:
  # 本地网络与 SSH；个人资产直连规则请仅在本地按需添加。
  - RULE-SET,private_ip,直连,no-resolve
  - RULE-SET,private_domain,直连
  - DST-PORT,22,直连

  # ==================== 2. 基础拦截 (广告 & QUIC 阻断) ====================
